    <!DOCTYPE html>
<html>
<head>
    <title>Skodex Key Vault Encryption</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f7fb;
            padding: 40px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ddd;
        }

        h1 {
            color: #0066ff;
        }

        .encrypted {
            overflow-wrap: anywhere;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Skodex Azure Key Vault Encryption</h1>

        <h2>Original Message</h2>
        <p>{{ original_message }}</p>

        <h2>Encrypted Message</h2>
        <p class="encrypted">{{ encrypted_message }}</p>

        <h2>Decrypted Message</h2>
        <p>{{ decrypted_message }}</p>

        <h3>Connection Status</h3>
        <p>{{ key_status }}</p>

    </div>

</body>
</html>

</body>
</html>
